name = "quotamesh-api"
main = "src/worker.ts"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "api.quotamesh.parasyte.cloud/*", zone_name = "parasyte.cloud" }
]

# Secrets and private connection strings must be configured with `wrangler secret put`
# or Cloudflare dashboard secrets. Never place them in this file.
